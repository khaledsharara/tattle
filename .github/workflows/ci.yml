# Every pull request and push to main: backend tests, the dashboard's types and
# build, the privacy check, and the image itself running the demo.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint
        working-directory: backend
        run: python -m pyflakes tattle tests
      - name: Tests
        working-directory: backend
        run: python -m pytest -q

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Typecheck and build
        run: npm run build
        working-directory: frontend

  privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check-privacy.py

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t tattle:ci .
      - name: The demo answers
        run: |
          docker run -d --name demo -p 8090:8090 -e TATTLE_DEMO=1 tattle:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8090/api/health > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:8090/api/health
          curl -fsS http://localhost:8090/api/status | grep -q '"mode":"demo"'
          curl -fsS http://localhost:8090/ | grep -q '<title>Tattle</title>'
      - name: Logs
        if: failure()
        run: docker logs demo
